name: Auto Author Assign

on:
    pull_request_target:
        types: [ opened, reopened ]

permissions:
    pull-requests: write

jobs:
    assign-author:
        name: Set Assignee
        runs-on: ubuntu-latest
        steps:
            - uses: toshimaru/auto-author-assign@v3.0.1
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
